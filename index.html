<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
           body {
            background-color: #4a4a4a;
            color: white; 
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
           }
            .round-image {
            width: 150px; 
            height: 150px; 
            border-radius: 50%;
            object-fit: cover; 
            }
            .button {
            border: none;
            color: rgb(27, 0, 88);
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            }

            .button1 {
            background-color: whitesmoke;
            }
    </style>
</head>
<body>
    <img src="PFP.jpg" alt="Profile Picture" class="round-image">
    <button><a style="text-decoration:none;" href="https://www.youtube.com/@Quicxx" class="button button1" target="_blank">Youtube Profile</a></button>
     
</body>
</html>
